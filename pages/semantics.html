<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
</head>

<body>
    <h1>3 Different semantics</h1>

    <!-- Article semantic - este bloco e usado para fazer um artigo onde a data pode ser modada ou reutilizada-->
    <div>
        <article class="forecast">
            <h1>Weather forecast for Seattle</h1>
            <article class="day-forecast">
                <h2>03 March 2018</h2>
                <p>Rain.</p>
            </article>
            <article class="day-forecast">
                <h2>04 March 2018</h2>
                <p>Periods of rain.</p>
            </article>
            <article class="day-forecast">
                <h2>05 March 2018</h2>
                <p>Heavy rain.</p>
            </article>
        </article>
    </div>


    <!-- figcaption semantic - pelo que percebi isto e utilizado para dar um nome a uma imagem -->
    <div>
        <figure>
            <img src="../images/pangolin.png" alt="Pangolin">
            <figcaption>Pangolin</figcaption>
        </figure>
    </div>

    <!-- form - este e usado para fazer formularios -->
    <div>
        <form action="/submit" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>


</html>
